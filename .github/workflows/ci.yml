name: CI

# Monorepo CI. Only the parts of the tree that changed are built and tested,
# so an agent touching web/ never waits on the Kotlin services.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      services: ${{ steps.filter.outputs.services }}
      service_list: ${{ steps.discover.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            services:
              - 'services/**'

      - name: Discover Kotlin services
        id: discover
        run: |
          set -euo pipefail
          if [ -d services ]; then
            list=$(find services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R . | jq -sc .)
          else
            list='[]'
          fi
          echo "services=$list" >> "$GITHUB_OUTPUT"

  web:
    name: Web (React)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  services:
    name: Service ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services == 'true' && needs.changes.outputs.service_list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.service_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        working-directory: services/${{ matrix.service }}
        run: ./gradlew --no-daemon build

  # Aggregate check, so branch protection can require one status regardless of
  # which components a given PR happens to touch.
  ci-ok:
    name: CI
    needs: [web, services]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no component failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "component results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled) echo "a component failed"; exit 1 ;;
            esac
          done
